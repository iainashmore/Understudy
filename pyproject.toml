[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstraction-harness"
version = "0.1.0"
description = "Abstraction-layer harness and the prompt flow recorder/runner"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "jsonschema>=4",
]

[project.optional-dependencies]
# Authoring-only: rasterizes the harness's golden references. Deliberately a
# different rasterizer from any environment's, so no layer shares a code path
# with the reference it is scored against.
authoring = ["cairosvg>=2.7"]
# Playwright is not for driving anything: Understudy drives Windows
# applications. It opens Understudy's own page in the tests, and renders a
# transcript to PDF.
dev = ["pytest>=8", "playwright>=1.40"]
pdf = ["playwright>=1.40"]
agent = ["anthropic>=1.0"]
ocr = ["pytesseract>=0.3"]
native = ["pywinauto>=0.6", "pyperclip>=1.8"]

[tool.setuptools]
packages = [
    "harness", "harness.agents", "harness.environments",
    "understudy", "understudy.drivers", "understudy.ui",
]

[tool.setuptools.package-data]
"understudy" = ["schema/*.json"]
"understudy.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # The only tests that touch a real desktop. Skipped off Windows, and run
    # in CI on a windows-latest runner -- they drive Notepad, so they need a
    # session with a desktop in it and they are not safe to run in parallel.
    "native_live: drives a real Windows application",
]
