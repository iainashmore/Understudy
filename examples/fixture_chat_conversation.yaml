# A session, not a single question.
#
# The one-prompt flow next to this is the simple case: ask once, read once.
# Real use of an embedded assistant is a conversation -- ask, read the answer,
# do something in the application, ask a follow-up that depends on it. LEO in
# CATIA is used exactly that way, and a flow that can only ask once can only
# rehearse a quarter of the session.
#
# Nothing here is a new mechanism. A turn is a `type` followed by a `read`, and
# any number of them can sit in one flow; the transcript groups them back into
# exchanges by which read followed which prompt. Each turn is its own variable,
# so one row of prompts describes a whole conversation and the next row
# describes the same conversation asked differently.

version: 1
name: fixture-chat-conversation
title: Chat assistant — a three-turn conversation
description: Ask, read, ask a follow-up, read, ask again — one prompt run, three exchanges
tags: [assistant, conversation]

subject:
  app: Fixture chat
  model: fixture

target_app:
  web:
    url: "../fixtures/chat_app/index.html?mode=stream&delay=25&dialog=portal&banner=1"
    viewport: {width: 900, height: 700}

defaults:
  timeout_ms: 10000
  poll_interval_ms: 200
  stable_for_ms: 600

targets:
  cookie_banner:
    intent: cookie consent button, appears unpredictably
    web:
      - testid: accept-cookies

  new_chat:
    intent: clears the conversation and starts a fresh one
    web:
      - testid: new-chat

  prompt_box:
    intent: the main message input
    web:
      - testid: prompt-input

  send_button:
    intent: submits the message
    web:
      - testid: send

  confirm_dialog:
    intent: confirmation that appears before sending
    web:
      - testid: confirm-send

  stop_button:
    intent: visible only while a response is being generated
    web:
      - testid: stop

  response_area:
    intent: where the assistant reply appears
    web:
      - testid: response

interstitials:
  - cookie_banner

reset:
  - action: click
    target: new_chat

# One row is one conversation. The second asks the same three things in a
# different order of politeness, which is the sort of thing that turns out to
# matter and is impossible to check by hand twice in a row.
prompts:
  - id: direct
    opening: Summarise this in one paragraph.
    followup: Now make it one sentence.
    closing: What did you leave out?
  - id: polite
    opening: Could you summarise this in a paragraph, please?
    followup: Thank you — could that be a single sentence?
    closing: Which details were dropped?

steps:
  - action: capture
    label: 1-before

  # Turn one.
  - action: type
    target: prompt_box
    text: "{{opening}}"
  - action: click
    target: send_button
  - action: click
    target: confirm_dialog
    optional: true
  - action: wait_for_stable
    target: response_area
    until_hidden: stop_button
    stable_for_ms: 500
    timeout_ms: 30000
  - action: read
    target: response_area
    store_as: reply_1
  - action: capture
    label: 2-first-reply

  # Turn two, which only makes sense after turn one.
  - action: type
    target: prompt_box
    text: "{{followup}}"
  - action: click
    target: send_button
  - action: click
    target: confirm_dialog
    optional: true
  - action: wait_for_stable
    target: response_area
    until_hidden: stop_button
    stable_for_ms: 500
    timeout_ms: 30000
  - action: read
    target: response_area
    store_as: reply_2
  - action: capture
    label: 3-second-reply

  # Turn three.
  - action: type
    target: prompt_box
    text: "{{closing}}"
  - action: click
    target: send_button
  - action: click
    target: confirm_dialog
    optional: true
  - action: wait_for_stable
    target: response_area
    until_hidden: stop_button
    stable_for_ms: 500
    timeout_ms: 30000
  - action: read
    target: response_area
    store_as: reply_3
  - action: capture
    label: 4-third-reply
