# The native driver, against a real Windows desktop.
#
# Everything else about that driver is tested against synthetic UIA trees. This
# is the only job that makes it touch Windows: it drives Notepad end to end, so
# every pywinauto and Win32 call runs at least once somewhere before it runs in
# front of a CAD application with somebody watching.
#
# Notepad is not CATIA. But Desktop(backend='uia'), the tree walk, SetCursorPos,
# SendInput, type_keys, the UIA value pattern, the clipboard fallback,
# capture_as_image and the DPI calls underneath are all the same ones.

name: native

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "understudy/drivers/native.py"
      - "understudy/native_match.py"
      - "understudy/geometry.py"
      - "understudy/os_pointer.py"
      - "understudy/keyboard.py"
      - "understudy/cursor.py"
      - "tests/understudy/test_native_live.py"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "understudy/drivers/native.py"
      - "understudy/native_match.py"
      - "tests/understudy/test_native_live.py"

jobs:
  notepad:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[native,ocr]" pytest

      - name: What this runner looks like
        shell: python
        run: |
          # Printed whatever happens: if the tests fail, the first question is
          # whether the runner had a desktop at all.
          from understudy.geometry import enumerate_monitors, make_dpi_aware
          print("dpi awareness:", make_dpi_aware())
          for monitor in enumerate_monitors():
              print(" ", monitor)

      - name: Drive Notepad
        run: pytest tests/understudy/test_native_live.py -v -m native_live

      - name: Fetch ffmpeg, so the recorder can be proven too
        shell: bash
        run: |
          python packaging/fetch_payload.py --skip-browsers --skip-ocr
          # pwd -W, not $PWD: Git Bash reports /d/a/..., which Python -- a
          # native Windows process -- cannot resolve, so shutil.which never
          # finds ffmpeg. That is why the first Notepad run recorded nothing.
          echo "$(pwd -W)/packaging/payload/tools" >> "$GITHUB_PATH"

      - name: Check the recorder can actually see it
        shell: bash
        run: |
          # Fail here rather than producing a run with no video in it. The
          # whole point of fetching ffmpeg is that the recorder gets exercised.
          python -c "
          import sys
          from understudy.recording import find_ffmpeg
          found = find_ffmpeg()
          print('ffmpeg:', found)
          sys.exit(0 if found else 1)
          "

      - name: Replay a flow against Notepad
        shell: bash
        run: |
          # The driver tests exercise the driver. This exercises everything
          # above it -- runner, screenshots, reads, transcript, video -- which
          # is the part somebody actually looks at.
          python -m understudy.cli run examples/notepad.yaml \
            --backend native --out runs/notepad --record --pdf

      - name: Cut anchors out of a live Notepad
        run: python tools/make_notepad_anchors.py

      - name: Replay it blind — no UIA at all
        shell: bash
        run: |
          # The worst case, and the one CATIA is likely to be: every control
          # found by matching a picture, the text read by OCR off the pixels.
          # Nothing here asks UIA for a control type, a name or an automation
          # id, because a CAD package exposes none of them.
          python -m understudy.cli run examples/notepad_blind.yaml \
            --backend native --out runs/notepad-blind --record

      - name: Show what it produced
        if: always()
        shell: bash
        run: |
          # Diagnostic only. If an earlier step died the directory may not be
          # there at all, and this step complaining about that on top of the
          # real failure just buries it.
          for run in runs/notepad runs/notepad-blind; do
            echo "===== $run"
            if [ -d "$run" ]; then
              find "$run" -type f | sort
              echo "-----"
              [ -f "$run/transcript.md" ] && cat "$run/transcript.md"
            else
              echo "(not produced)"
            fi
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notepad-run-${{ github.run_number }}
          path: runs
          # Warn, not error: when the run failed before producing anything the
          # failure is already reported above, and a second red X for the
          # missing artifact points at the wrong step.
          if-no-files-found: warn

      - name: Everything else, on Windows
        # The rest of the suite has only ever run on Linux. Windows path
        # handling and line endings are their own category of bug.
        run: pytest tests/understudy -q -m "not native_live" --deselect tests/understudy/test_cdp_attach.py
