# Builds the downloadable Understudy application.
#
# On a Windows runner because PyInstaller cannot cross-compile: a Windows
# executable has to be produced on Windows, and there is no way around that.
# The installer lands as a workflow artifact, and on a tag as a release asset.

name: desktop

on:
  # Dispatching only works once this file is on the default branch, which is
  # why the branch trigger below exists as well.
  workflow_dispatch:
    inputs:
      include_browsers:
        description: "Bundle Chromium (adds ~600MB; needed only for launch-mode web flows)"
        type: boolean
        default: false
  # Deliberately no build on an ordinary push. A Windows runner bills at double
  # rate and emails on every failure, and iterating on packaging through CI
  # turns both into noise -- which is exactly what happened while this was
  # being written. Build when you want one: the Run workflow button, a version
  # tag, or a published release.
  #
  # A tag now carries no paths filter to conflict with, since ordinary pushes
  # do not build at all. Pushing v0.1.0 produces the full bundle and creates
  # the release with the installer attached.
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Python side
        run: |
          python -m pip install --upgrade pip
          pip install ".[web,agent,ocr,native]"
          pip install pyinstaller

      - name: Install Tesseract, so the bundle has an engine to carry
        run: choco install tesseract -y --no-progress

      - name: Stage the bundled binaries
        shell: bash
        env:
          # A release carries everything. A development build skips Chromium
          # unless asked: it is 600MB and most of the build time, and it is not
          # needed to attach to an embedded panel over CDP, which is the case
          # this tool exists for.
          FULL: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.include_browsers == true }}
        run: |
          if [ "$FULL" = "true" ]; then
            python packaging/fetch_payload.py
          else
            python packaging/fetch_payload.py --skip-browsers
          fi

      - name: Check the payload has everything the bundle promises
        shell: bash
        run: |
          # Staging reports a missing piece and carries on, which is right for
          # a developer build and wrong here: this artifact is the one people
          # download, and a feature missing from it fails on their machine,
          # not on this one.
          python -c "
          import pathlib, sys
          payload = pathlib.Path('packaging/payload')
          wanted = ['tools/ffmpeg.exe', 'tools/tesseract.exe',
                    'tessdata/eng.traineddata']
          missing = [name for name in wanted if not (payload / name).exists()]
          for name in wanted:
              path = payload / name
              print(f'{name}: {path.stat().st_size if path.exists() else \"MISSING\"}')
          sys.exit(1 if missing else 0)
          "

      - name: Build the server
        run: pyinstaller --noconfirm --clean --distpath dist packaging/understudy-server.spec

      - name: Check the engine survived the freeze and runs from the bundle
        shell: bash
        run: |
          # PyInstaller collects data directories; whether a binary inside one
          # still runs from where it landed is a different question, and the
          # answer arrives on somebody else's machine if nobody asks it here.
          # Found rather than assumed: PyInstaller 6 moved collected data under
          # _internal, and hard-coding either layout breaks on the other.
          for tool in tesseract ffmpeg; do
            found=$(find dist/server -name "$tool.exe" | head -1)
            if [ -z "$found" ]; then
              echo "$tool.exe did not survive the freeze"
              exit 1
            fi
            echo "$found"
            "$found" --version 2>&1 | head -1 || "$found" -version 2>&1 | head -1
          done

      - name: Check the server actually starts
        shell: bash
        run: |
          # A build that imports cleanly and then cannot serve a page is the
          # failure this catches, and the one that would otherwise be found by
          # the person who downloaded it.
          ./dist/server/understudy-server.exe --port 8791 &
          server=$!
          # Stopped however this step ends. Leaving it running makes the
          # runner's orphan cleanup do it instead, which hides a server that
          # hung rather than exited.
          trap 'taskkill //PID $server //F //T > /dev/null 2>&1 || kill $server 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8791/; then
              echo "the packaged server is serving"
              curl -sf http://127.0.0.1:8791/api/flows > /dev/null && echo "and answering the API"
              exit 0
            fi
            sleep 2
          done
          echo "the packaged server never came up"
          exit 1

      - name: Check the packaged page loads and runs
        shell: bash
        run: |
          # Serving is not the same as working. A script that throws on load
          # leaves an empty sidebar, an empty flow list, and every API check
          # above still green -- which happened twice while this was being
          # written, both times found by a screenshot rather than a test.
          # Against the packaged build specifically, because "PyInstaller
          # collected the page" and "the frozen server serves it correctly
          # from where it landed" are different questions.
          bundle=$(dirname "$(find dist/server -name understudy-server.exe | head -1)")
          python packaging/check_packaged_ui.py \
            ./dist/server/understudy-server.exe "$bundle"

      - name: Build the installer
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Understudy-windows-installer-${{ github.run_number }}
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Publish the release with the installer attached
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          generate_release_notes: true
          body: |
            The Windows installer is attached below. Download
            `Understudy-*-win64-setup.exe` and run it — no Python, no pip and
            no browser download, and nothing is fetched at first run.

            It is not code-signed, so SmartScreen will warn on first run:
            **More info → Run anyway**. A managed workstation may block it
            outright, in which case whoever administers the machine has to
            allow it.

            If the window does not appear, the application is still a local
            server: open <http://127.0.0.1:8765> in any browser.
