<!doctype html>
<meta charset="utf-8">
<title>Shadow Chat</title>
<!--
  A chat panel built the way a component framework builds one: custom elements
  with open shadow roots, nested two deep, and the document itself holding
  nothing but the outermost tag.

  This exists because document.querySelectorAll does not cross a shadow
  boundary. A tool that inspects a panel with it reports a page full of
  content as empty, which is exactly what happened against 3DEXPERIENCE: six
  live WebViews, all reported as having nothing in them.

  Loaded over about:blank on purpose too -- NavigateToString leaves the URL
  as about:blank, so "the URL says about:blank" is not evidence of an empty
  page either.
-->
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
</style>

<leo-panel></leo-panel>

<script>
class LeoComposer extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: "open" });
    root.innerHTML = `
      <style>
        textarea { width: 340px; height: 64px; }
        button { padding: 4px 12px; }
        .hidden { display: none; }
      </style>
      <textarea data-testid="leo-prompt" aria-label="Ask LEO"
                placeholder="Ask about this part"></textarea>
      <button data-testid="leo-send" aria-label="Send">Send</button>
      <button data-testid="leo-stop" class="hidden">Stop</button>
    `;
  }
}

class LeoTranscript extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: "open" });
    // Empty until a reply streams in, which is why it cannot be found by its
    // text. It is found by the role, the way a chat UI marks it.
    root.innerHTML = `
      <div data-testid="leo-answer" role="log" aria-live="polite"
           style="width:340px;min-height:80px"></div>
    `;
  }
}

class LeoPanel extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: "open" });
    root.innerHTML = `<leo-transcript></leo-transcript>
                      <leo-composer></leo-composer>`;
  }
}

customElements.define("leo-composer", LeoComposer);
customElements.define("leo-transcript", LeoTranscript);
customElements.define("leo-panel", LeoPanel);
</script>
