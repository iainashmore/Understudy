<!doctype html>
<meta charset="utf-8">
<title>Fixture CAD</title>
<!--
  A stand-in shaped like CATIA V5 / 3DEXPERIENCE with an assistant panel,
  built to reproduce the things that break UI replay in a real CAD application:

    * an opaque viewport -- a <canvas>, no accessible children, no text, and it
      never stops moving. Whole-window pixel stability can never settle against
      it, which is why stability has to be scoped to a region.
    * custom-drawn toolbar controls with no role, no name and no text, so
      accessible-name strategies fail and only structural selectors resolve.
    * an assistant panel whose response can render either as DOM text (the
      embedded-web-view case, readable) or painted into a canvas (the
      custom-drawn case, unreadable -- pixel stability is the only signal).

  Query parameters:
    panel=dom|canvas          where the response renders (default dom)
    controls=labelled|unlabelled  tooltips on the toolbar, or nothing at all
    busy=spinner|none         whether a completion signal exists
    viewport=spin|static      whether the 3D view animates forever
    delay=<ms>                per-token streaming delay (default 40)
    dialogpos=a|b|<x>,<y>     where the properties dialog opens. The same
                              dialog, same contents, different screen position.
-->
<style>
  body { font: 13px system-ui, sans-serif; margin: 0; display: grid;
         grid-template-columns: 190px 1fr 300px; grid-template-rows: 40px 1fr;
         height: 100vh; }
  #toolbar { grid-column: 1 / -1; display: flex; gap: 4px; align-items: center;
             padding: 0 8px; background: #33383d; }
  .tool { width: 26px; height: 26px; background: #5a6169; border: 1px solid #7d858e;
          border-radius: 3px; cursor: pointer; }
  .tool:hover { filter: brightness(1.15); }
  #tree { background: #f0f1f3; border-right: 1px solid #ccc; padding: 8px;
          overflow: auto; }
  #tree ul { list-style: none; padding-left: 14px; margin: 2px 0; }
  #viewport { display: block; background: #1b2733; width: 100%; height: 100%; }
  #stage { position: relative; overflow: hidden; }
  #panel { border-left: 1px solid #ccc; padding: 10px; display: flex;
           flex-direction: column; gap: 8px; background: #fafafa; }
  #ask { height: 60px; }
  #reply { flex: 1; border: 1px solid #ccc; background: #fff; padding: 8px;
           white-space: pre-wrap; overflow: auto; }
  #replyCanvas { border: 1px solid #ccc; background: #fff; }
  .hidden { display: none; }
  #busy { color: #b36b00; }
  .node { cursor: pointer; padding: 0 3px; border-radius: 2px; }
  .node.selected { background: #2f6fb5; color: #fff; }
  #dialog { position: fixed; width: 260px; background: #eef0f2;
            border: 1px solid #6b7580; box-shadow: 0 6px 18px rgba(0,0,0,.35);
            font: 13px system-ui, sans-serif; z-index: 20; }
  #dialog .bar { background: #4a5560; color: #fff; padding: 5px 8px;
                 font-weight: 600; }
  #dialog .body { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  #dialog input { padding: 3px 5px; }
  #dialog .row { display: flex; gap: 6px; justify-content: flex-end; }
</style>

<div id="toolbar"></div>

<div id="tree">
  <div><strong>Product1</strong></div>
  <ul>
    <li>xy plane</li>
    <li>yz plane</li>
    <li><span class="node">Part1</span>
      <ul>
        <li><span class="node">PartBody</span>
          <ul>
            <li><span class="node" id="node-pad">Pad.1</span></li>
            <li><span class="node">Pocket.1</span></li>
          </ul>
        </li>
        <li><span class="node">Sketch.1</span></li>
      </ul>
    </li>
  </ul>
</div>

<div id="stage"><canvas id="viewport"></canvas></div>

<div id="dialog" class="hidden">
  <div class="bar">Properties</div>
  <div class="body">
    <label id="nameLabel" for="nameField">Name</label>
    <input id="nameField" type="text">
    <div class="row">
      <button id="dlgCancel" type="button">Cancel</button>
      <button id="dlgDone" type="button">Done</button>
    </div>
  </div>
</div>

<div id="panel">
  <label for="ask">Assistant</label>
  <textarea id="ask" aria-label="Ask the assistant"></textarea>
  <button id="send" type="button">Ask</button>
  <div id="busy" class="hidden">Working…</div>
  <div id="reply" role="region" aria-label="Assistant reply"></div>
  <canvas id="replyCanvas" class="hidden" width="278" height="240"></canvas>
</div>

<script>
  const params    = new URLSearchParams(location.search);
  const panelMode = params.get("panel") || "dom";
  const controls  = params.get("controls") || "labelled";
  const hasBusy   = (params.get("busy") || "spinner") !== "none";
  const spinning  = (params.get("viewport") || "spin") !== "static";
  const delay     = Number(params.get("delay") || 40);

  // Toolbar: six identical custom-drawn controls. Labelled mode gives them a
  // tooltip; unlabelled mode gives them nothing an accessibility tree could
  // use, which is the normal state of a custom CAD toolbar.
  // Distinct glyph colours: a real toolbar has distinguishable icons even when
  // it exposes no names. That is what makes a visual anchor identifying.
  const TOOLS = ["New", "Open", "Save", "Sketch", "Pad", "Measure", "Properties"];
  const GLYPHS = ["#d94f4f", "#4fd98a", "#4f7fd9", "#d9c74f", "#a44fd9", "#4fd9d0",
                  "#ff8a3d"];
  const toolbar = document.getElementById("toolbar");
  TOOLS.forEach((label, index) => {
    const tool = document.createElement("div");
    tool.className = "tool";
    tool.dataset.index = String(index);
    tool.style.background =
      `radial-gradient(circle at 50% 50%, ${GLYPHS[index]} 0 7px, #5a6169 8px)`;
    if (controls === "labelled") {
      tool.setAttribute("title", label);
      tool.setAttribute("role", "button");
      tool.setAttribute("aria-label", label);
    }
    tool.addEventListener("click", () => {
      if (label === "Properties") openProperties();
      else tool.style.background = "#8fa8c8";
    });
    toolbar.appendChild(tool);
  });

  // The viewport: opaque to any accessibility API, and by default never still.
  const viewport = document.getElementById("viewport");
  const stage = document.getElementById("stage");
  function sizeViewport() {
    viewport.width = stage.clientWidth;
    viewport.height = stage.clientHeight;
  }
  sizeViewport();
  window.addEventListener("resize", sizeViewport);

  const ctx = viewport.getContext("2d");
  let angle = 0;
  function drawViewport() {
    const w = viewport.width, h = viewport.height;
    ctx.fillStyle = "#1b2733";
    ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.28;
    const points = [];
    for (let i = 0; i < 8; i++) {
      const sx = (i & 1) ? 1 : -1, sy = (i & 2) ? 1 : -1, sz = (i & 4) ? 1 : -1;
      const x = sx * Math.cos(angle) - sz * Math.sin(angle);
      const z = sx * Math.sin(angle) + sz * Math.cos(angle);
      const scale = 1 / (2.6 - z * 0.5);
      points.push([cx + x * r * scale * 1.7, cy + sy * r * scale * 1.7]);
    }
    ctx.strokeStyle = "#7fd4ff";
    ctx.lineWidth = 1.4;
    const edges = [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],[0,4],[1,5],[2,6],[3,7]];
    edges.forEach(([a, b]) => {
      ctx.beginPath();
      ctx.moveTo(points[a][0], points[a][1]);
      ctx.lineTo(points[b][0], points[b][1]);
      ctx.stroke();
    });
    if (spinning) { angle += 0.02; requestAnimationFrame(drawViewport); }
  }
  drawViewport();

  // Geometry tree selection.
  let selected = null;
  document.querySelectorAll(".node").forEach((node) => {
    node.addEventListener("click", () => {
      document.querySelectorAll(".node").forEach((n) => n.classList.remove("selected"));
      node.classList.add("selected");
      selected = node;
    });
  });

  // The properties dialog. Same markup and same contents wherever it opens --
  // only its position on screen changes, which is the whole point.
  const DIALOG_POSITIONS = { a: [300, 170], b: [640, 400] };
  const dialog = document.getElementById("dialog");
  const nameField = document.getElementById("nameField");

  function dialogOrigin() {
    const requested = params.get("dialogpos") || "a";
    if (requested.includes(",")) return requested.split(",").map(Number);
    return DIALOG_POSITIONS[requested] || DIALOG_POSITIONS.a;
  }

  function openProperties() {
    if (!selected) return;
    const [x, y] = dialogOrigin();
    dialog.style.left = x + "px";
    dialog.style.top = y + "px";
    nameField.value = selected.textContent;
    dialog.classList.remove("hidden");
    nameField.focus();
  }

  document.getElementById("dlgDone").addEventListener("click", () => {
    if (selected && nameField.value.trim()) selected.textContent = nameField.value.trim();
    dialog.classList.add("hidden");
  });
  document.getElementById("dlgCancel").addEventListener("click", () => {
    dialog.classList.add("hidden");
  });

  // The assistant panel.
  const reply       = document.getElementById("reply");
  const replyCanvas = document.getElementById("replyCanvas");
  const busy        = document.getElementById("busy");
  const ask         = document.getElementById("ask");

  if (panelMode === "canvas") {
    reply.classList.add("hidden");
    replyCanvas.classList.remove("hidden");
  }

  function paintReply(text) {
    // Painted pixels: there is no DOM text to read here, by design.
    const c = replyCanvas.getContext("2d");
    c.fillStyle = "#ffffff";
    c.fillRect(0, 0, replyCanvas.width, replyCanvas.height);
    c.fillStyle = "#111111";
    c.font = "13px system-ui, sans-serif";
    let line = "", y = 20;
    text.split(/\s+/).filter(Boolean).forEach((word) => {
      const attempt = line ? line + " " + word : word;
      if (c.measureText(attempt).width > replyCanvas.width - 16) {
        c.fillText(line, 8, y); y += 18; line = word;
      } else { line = attempt; }
    });
    if (line) c.fillText(line, 8, y);
  }

  function render(text) {
    if (panelMode === "canvas") paintReply(text);
    else reply.textContent = text;
  }

  document.getElementById("send").addEventListener("click", () => {
    const context = selected ? ` [selected: ${selected.textContent}]` : "";
    const words = ("Echo: " + ask.value + context).split(/\s+/).filter(Boolean);
    render("");
    if (hasBusy) busy.classList.remove("hidden");
    let index = 0;
    const timer = setInterval(() => {
      if (index >= words.length) {
        clearInterval(timer);
        if (hasBusy) busy.classList.add("hidden");
        return;
      }
      index += 1;
      render(words.slice(0, index).join(" "));
    }, delay);
  });
</script>
